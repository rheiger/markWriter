<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MarkWriter — paper, ink and a brass fountain pen</title>
  <defs>
    <linearGradient id="tile" x1="126" y1="82" x2="880" y2="956" gradientUnits="userSpaceOnUse">
      <stop stop-color="#236779"/>
      <stop offset=".46" stop-color="#153c55"/>
      <stop offset="1" stop-color="#302541"/>
    </linearGradient>
    <linearGradient id="rim" x1="194" y1="64" x2="822" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91d0cd" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#62969f" stop-opacity=".08"/>
      <stop offset="1" stop-color="#b99aab" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="paper" x1="288" y1="192" x2="684" y2="818" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffef1"/>
      <stop offset=".62" stop-color="#f7efd9"/>
      <stop offset="1" stop-color="#ddc6a8"/>
    </linearGradient>
    <linearGradient id="fold" x1="612" y1="192" x2="726" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e1d7bd"/>
      <stop offset="1" stop-color="#fffbee"/>
    </linearGradient>
    <linearGradient id="barrel" x1="-78" y1="-100" x2="78" y2="-100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082a3b"/>
      <stop offset=".42" stop-color="#357580"/>
      <stop offset=".68" stop-color="#15485d"/>
      <stop offset="1" stop-color="#071e34"/>
    </linearGradient>
    <linearGradient id="brass" x1="-112" y1="76" x2="112" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1b4"/>
      <stop offset=".35" stop-color="#f2ca79"/>
      <stop offset=".68" stop-color="#d9994f"/>
      <stop offset="1" stop-color="#ad603c"/>
    </linearGradient>
    <linearGradient id="band" x1="-78" y1="0" x2="78" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e3aa59"/>
      <stop offset=".4" stop-color="#fff1ba"/>
      <stop offset="1" stop-color="#bd783f"/>
    </linearGradient>
  </defs>

  <!-- The transparent surround and inset tile work on all desktop surfaces. -->
  <rect x="64" y="82" width="896" height="896" rx="204" fill="#081329" opacity=".24"/>
  <rect x="64" y="56" width="896" height="896" rx="204" fill="url(#tile)"/>
  <rect x="67" y="59" width="890" height="890" rx="201" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- A slightly turned sheet, with a folded corner and a warm cut-paper edge. -->
  <g transform="rotate(-7 500 500)">
    <path d="M300 202H610L740 332V806Q740 846 700 846H300Q260 846 260 806V242Q260 202 300 202Z" fill="#071728" opacity=".35"/>
    <path d="M300 180H610L740 310V784Q740 824 700 824H300Q260 824 260 784V220Q260 180 300 180Z" fill="url(#paper)"/>
    <path d="M300 184H608L735 311" fill="none" stroke="#fffef6" stroke-width="8" stroke-linejoin="round" opacity=".8"/>
    <path d="M610 180V276Q610 310 644 310H740Z" fill="#a48f75" opacity=".2" transform="translate(-4 8)"/>
    <path d="M610 180V274Q610 310 646 310H740Z" fill="url(#fold)"/>
    <path d="M342 344H540M342 420H584M342 496H500" fill="none" stroke="#467181" stroke-width="25" stroke-linecap="round"/>
  </g>

  <!-- One continuous, deliberately human ink flourish leads to the nib. -->
  <path d="M384 714C338 770 256 784 237 740C215 689 280 658 315 682C352 708 319 753 287 751" fill="none" stroke="#1d5266" stroke-width="24" stroke-linecap="round"/>
  <path d="M239 739C250 763 276 768 300 761" fill="none" stroke="#4b8190" stroke-width="6" stroke-linecap="round" opacity=".6"/>

  <!-- The broad silhouette and central slit remain readable at small sizes. -->
  <g transform="translate(678 426) rotate(43)" fill="#081c2a" opacity=".28">
    <path d="M-78-156Q-78-180-54-180H54Q78-180 78-156V4L112 188Q80 299 0 414Q-80 299-112 188L-78 4Z"/>
  </g>
  <g transform="translate(666 408) rotate(43)">
    <path d="M-78-156Q-78-180-54-180H54Q78-180 78-156V10H-78Z" fill="url(#barrel)"/>
    <path d="M-48-148V-26" fill="none" stroke="#89b3ae" stroke-width="10" stroke-linecap="round" opacity=".6"/>
    <path d="M-64 0H64L112 188Q80 299 0 414Q-80 299-112 188Z" fill="url(#brass)"/>
    <path d="M0 0H64L112 188Q80 299 0 414V206Q35 183 0 148Z" fill="#985037" opacity=".16"/>
    <path d="M-48 32L-81 178Q-74 211-55 246" fill="none" stroke="#fff5cc" stroke-width="9" stroke-linecap="round" opacity=".72"/>
    <circle cx="0" cy="172" r="24" fill="#173d50"/>
    <path d="M0 195V414" fill="none" stroke="#173d50" stroke-width="16"/>
    <path d="M-78-14H78V18H-78Z" fill="url(#band)"/>
    <path d="M-75-12H74" fill="none" stroke="#fff0bc" stroke-width="5" opacity=".8"/>
  </g>
</svg>
