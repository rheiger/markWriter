name: PI 2.19 Nautilus selector diagnostic
on:
  push:
    branches: ['codex/pi-2.19-nautilus-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu Files and desktop diagnostic tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            nautilus at-spi2-core python3-pyatspi desktop-file-utils tesseract-ocr \
            xvfb xauth xdotool openbox dbus-x11 scrot
          dpkg-query -W nautilus
      - name: Drive the stock Nautilus UI
        run: bash tools/pi-2.19-nautilus-probe.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nautilus-50-probe
          path: nautilus-probe-evidence/
          if-no-files-found: warn
