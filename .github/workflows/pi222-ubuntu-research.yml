name: PI 2.22 release installed Ubuntu PlantUML package
on:
  push:
    branches: [codex/pi-222-release-installer-qa]
    paths: [research/pi-2.22-release/request.json]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Download the exact release package and verify its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research/pi-2.22-release/download.py ubuntu-26.04-x64 receipts
      - name: Prepare native drivers
        run: |
          bash tools/setup-linux-packages.sh package
          sudo apt-get install -y --no-install-recommends x11-utils
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Install and verify the exact Ubuntu binary
        run: |
          manifest=candidate/ubuntu-26.04-x64.manifest.json
          deb="candidate/$(jq -er .asset.name "$manifest")"
          version="$(jq -er .version "$manifest")"
          test "$(dpkg-deb -f "$deb" Package)" = mark-writer
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          sudo dpkg -i "$deb"
          test "$(dpkg-query -W -f='${Version}' mark-writer)" = "$version"
          printf '%s  %s\n' "$(jq -er .binaryInspection.sha256 "$manifest")" /usr/bin/markwriter | sha256sum -c -
          dpkg-query -W mark-writer > receipts/installed-package.txt
          pkg-config --modversion webkit2gtk-4.1 > receipts/webkit-version.txt
          cat /etc/os-release > receipts/os-release.txt
      - name: Exercise the installed package and save its native HTML export
        run: |
          sudo --preserve-env=PATH unshare --net bash research/pi-2.22-ubuntu/offline.sh
      - name: Retain export and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi222-release-ubuntu-plantuml-evidence
          path: receipts/
          retention-days: 14
          if-no-files-found: warn
