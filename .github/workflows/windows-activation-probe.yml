name: Windows activation diagnostic
on:
  push:
    branches: ['codex/2.7.4']
    paths: ['.github/workflows/windows-activation-probe.yml', 'native/windows-preview/explorer-acceptance.ps1']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-x64-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          fail-on-cache-miss: true
      - name: Prepare medium-integrity probe
        shell: pwsh
        run: ./tools/setup-windows-acceptance.ps1
      - name: Exercise cached installer and trace the shell launch
        shell: pwsh
        run: |
          $candidate = (Get-Item 'src-tauri/target/release/bundle/nsis/MarkWriter_2.7.4_x64-setup.exe').FullName
          Write-Host "Diagnostic cached installer SHA-256 $((Get-FileHash $candidate).Hash)"
          $process = Start-Process -FilePath $candidate -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode) { throw "Cached setup failed ($($process.ExitCode))" }
          $env:MARKWRITER_BINARY = Join-Path $env:ProgramFiles 'MarkWriter/markwriter.exe'
          $env:MARKWRITER_PROFILE_DIR = Join-Path $env:RUNNER_TEMP 'markwriter-activation-probe'
          $env:MARKWRITER_PREVIEW_RESULT = Join-Path $env:RUNNER_TEMP 'markwriter-activation-probe.json'
          $dll = Join-Path (Split-Path -Parent $env:MARKWRITER_BINARY) 'MarkWriterPreview.dll'
          $expected = (Get-FileHash -LiteralPath $dll).Hash
          & $env:MARKWRITER_GSUDO --integrity Medium pwsh -NoProfile -File 'native/windows-preview/explorer-acceptance.ps1' -Bundled -ExpectedSha256 $expected
          exit $LASTEXITCODE
