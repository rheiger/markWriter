name: Isolated PI 2.12 macOS qualification
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Exact-source production package run
        required: true
        type: string
      source:
        description: Exact integrated source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read

jobs:
  seal-and-test-macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Verify the source and seal the hosted package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          SOURCE_COMMIT: ${{ inputs.source }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ && "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C release-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq .head_sha)" = "$SOURCE_COMMIT"
          version="$(node -p "require('./release-source/src-tauri/tauri.conf.json').version")"
          [[ "$version" =~ ^2\.12\.[0-9]+$ ]]
          work="$(mktemp -d /private/tmp/markwriter-pi212-release.XXXXXX)"
          echo "QUALIFICATION_DIR=$work" >>"$GITHUB_ENV"
          echo "QUALIFICATION_VERSION=$version" >>"$GITHUB_ENV"
          gh run download "$PACKAGE_RUN" --name package-macos-arm64 --dir "$work"
          mv "$work/MarkWriter-$version-macos-arm64.dmg" "$work/hosted.dmg"
          git -C release-source archive HEAD >"$work/source.tar.gz"
          cp -a .github/pi212-qualification/. "$work/"
          (cd "$work" && bash seal-macos.sh "$version" "$SOURCE_COMMIT" | tee seal.log)
      - name: Verify installed startup and native Open through the final DMG
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_DIR"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export MARKWRITER_PROFILE_DIR="$(mktemp -d "$PWD/offline-profile.XXXXXX")"
          sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip))' "$PWD/sealed-app/MarkWriter.app/Contents/MacOS/markwriter" >offline-launch.log 2>&1 &
          test_pid=$!
          trap 'kill "$test_pid" >/dev/null 2>&1 || true' EXIT
          started=false
          for attempt in {1..300}; do
            kill -0 "$test_pid" 2>/dev/null || break
            if grep -Fq '[TAURI] Creating new document' offline-launch.log; then started=true; break; fi
            sleep 0.1
          done
          test "$started" = true
          kill "$test_pid"
          wait "$test_pid" || true
          trap - EXIT
          unset MARKWRITER_PROFILE_DIR
          # This disposable GitHub-hosted runner permits its automation user to run XCTest.
          sudo /usr/sbin/DevToolsSecurity -enable
          sudo /usr/sbin/dseditgroup -o edit -a "$(id -un)" -t user _developer
          mkdir open-fixtures open-profile
          printf '# Native Open dialog\n\nSealed PI 2.12 fixture — Grüße 日本語\n' >open-fixtures/Acceptance.md
          expected_fixture=$(shasum -a 256 open-fixtures/Acceptance.md)
          sed -i '' "s|/private/tmp/markwriter-282-open.IVBVyr|$PWD/sealed-app|g; s|Sealed 2.8.2 fixture|Sealed PI 2.12 fixture|g" ui/MarkWriterUITests.swift
          xcodebuild test -project ui/MarkWriterUI.xcodeproj -scheme MarkWriterUITests -destination 'platform=macOS,arch=arm64' -derivedDataPath "$PWD/derived-data" -parallel-testing-enabled NO -resultBundlePath "$PWD/native-open.xcresult" -only-testing:MarkWriterUITests/MarkWriterUITests/testSealedNativeOpenDialog >native-open.log 2>&1 || {
            xcrun xcresulttool export attachments --path "$PWD/native-open.xcresult" --output-path "$PWD/diagnostic-screens" || true
            tail -120 native-open.log
            exit 1
          }
          grep -F '** TEST SUCCEEDED **' native-open.log
          test "$(shasum -a 256 open-fixtures/Acceptance.md)" = "$expected_fixture"
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          fixture = Path("open-fixtures/Acceptance.md").resolve()
          workspace = json.loads(Path("open-profile/workspace.json").read_text())
          assert any(
              doc.get("path") and Path(doc["path"]).resolve() == fixture
              and doc["content"] == fixture.read_text()
              and doc["isDirty"] is False
              for doc in workspace["documents"]
          ), workspace
          print("PASS: native Open panel selected Unicode fixture and preserved original bytes and clean state")
          PYVERIFY
          echo "PASS: native Open panel selected Unicode fixture and preserved original bytes and clean state" >>native-open.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: macos-sealed-qualification
          path: |
            ${{ env.QUALIFICATION_DIR }}/MarkWriter-${{ env.QUALIFICATION_VERSION }}-macos-arm64.dmg
            ${{ env.QUALIFICATION_DIR }}/seal.log
            ${{ env.QUALIFICATION_DIR }}/sealed-sha256.txt
            ${{ env.QUALIFICATION_DIR }}/macos-version.txt
            ${{ env.QUALIFICATION_DIR }}/offline-launch.log
            ${{ env.QUALIFICATION_DIR }}/native-open.log
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() && env.QUALIFICATION_DIR != ''
        with:
          name: macos-qualification-diagnostic
          path: |
            ${{ env.QUALIFICATION_DIR }}/seal.log
            ${{ env.QUALIFICATION_DIR }}/offline-launch.log
            ${{ env.QUALIFICATION_DIR }}/native-open.log
            ${{ env.QUALIFICATION_DIR }}/diagnostic-screens/
          if-no-files-found: warn
