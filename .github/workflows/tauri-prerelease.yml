name: Tauri production packages
on:
  pull_request:
    paths: ['frontend/**', 'src-tauri/**', 'tools/**', 'notices/**', '.github/workflows/tauri-prerelease.yml']
  push:
    branches: [main, 'codex/offline-dot-alpha2']
    tags: ['v2.*']
    paths: ['frontend/**', 'src-tauri/**', 'tools/**', 'notices/**', '.github/workflows/tauri-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            bundles: dmg
          - os: ubuntu-26.04
            platform: ubuntu-26.04-x64
            bundles: deb
          - os: windows-2025
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build and ordinary desktop UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkitgtk-webdriver xvfb xdotool openbox dbus-x11
      - name: Select verified Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci --prefix frontend
      - name: Verify exact versions and publication trigger
        run: node tools/release-metadata.mjs --check
      - name: Quality gates on production source
        run: |
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          node --test tools/release-integrity.test.mjs tools/owned-process.test.mjs
          npm audit --prefix frontend --audit-level=low
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build ordinary production frontend
        run: npm run build --prefix frontend
      - name: Verify production bridge exclusion and license assets
        run: node tools/release-metadata.mjs --check-frontend
      - name: Build production installation package
        working-directory: src-tauri
        env:
          # No signing credentials are configured. Ad-hoc Apple signatures, when
          # generated by the toolchain, are explicitly not trusted distribution.
          CI: true
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles ${{ matrix.bundles }}
      - name: Install external native test driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Set up matching Windows WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/setup-edge-driver.ps1
          ./tools/setup-windows-acceptance.ps1
      - name: Install Windows package and block internet for its WebView
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-package-windows.ps1
      - name: Exercise installed Windows release at ordinary user privilege
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:MARKWRITER_GSUDO --integrity Medium pwsh -NoProfile -Command "node tools/installed-package-acceptance.mjs"
          exit $LASTEXITCODE
      - name: Install Ubuntu package
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          test -x /usr/bin/markwriter
          echo "MARKWRITER_BINARY=/usr/bin/markwriter" >> "$GITHUB_ENV"
          echo "MARKWRITER_PROFILE_DIR=$RUNNER_TEMP/markwriter-profile" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/markwriter-profile"
      - name: Exercise installed Ubuntu release in a network namespace without external routes
        if: runner.os == 'Linux'
        run: |
          sudo --preserve-env=MARKWRITER_BINARY,MARKWRITER_PROFILE_DIR,PATH,GITHUB_SHA,ImageOS,ImageVersion unshare --net bash tools/package-test-linux.sh
        env:
          GDK_BACKEND: x11
      - name: Verify DMG contents and installation
        if: runner.os == 'macOS'
        run: bash tools/install-package-macos.sh
      - name: Record package provenance, hashes and tested baseline
        run: node tools/release-metadata.mjs --collect ${{ matrix.platform }}
      - name: Retain production packages and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: release-assets/
          retention-days: 14
          if-no-files-found: error
      - name: Retain installed application evidence
        if: always() && hashFiles('package-acceptance-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-${{ matrix.platform }}
          path: package-acceptance-results/
          retention-days: 14
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-release-${{ hashFiles('src-tauri/Cargo.lock') }}
  draft-prerelease:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Create immutable draft prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release-metadata.mjs --aggregate
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release'; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --prerelease --latest=false --title "MarkWriter $GITHUB_REF_NAME — experimental Tauri" --notes-file docs/releases/2.1.0-alpha2.md
