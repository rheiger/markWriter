name: Disposable hosted Finder capability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe disposable desktop capabilities
        run: python3 tools/hosted-finder-capability-probe.py
      - name: Retain capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-finder-capability-evidence
          path: probe-evidence/
          if-no-files-found: error
          retention-days: 14
