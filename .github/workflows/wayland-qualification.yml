name: Ubuntu Wayland qualification
on:
  push:
    branches: [codex/pi-2.20-wayland]
    paths:
      - .github/workflows/wayland-qualification.yml
      - tools/test-ubuntu-wayland.sh
      - tools/wayland-association-desktop.py
      - tools/wayland-focus-observer/**
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Production packaging run ID. Leave blank for the v2.19.3 control.
        type: string
      candidate-sha256:
        description: Expected candidate DEB SHA-256 (required with a run ID).
        type: string
permissions:
  contents: read
  actions: read
jobs:
  nautilus:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the isolated GNOME desktop fixture
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y gnome-shell nautilus at-spi2-core python3-pyatspi python3-pil gir1.2-gtk-3.0 desktop-file-utils tesseract-ocr mesa-utils
      - name: Qualify the exact installed DEB
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate-run }}
          CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
        run: |
          if [[ -n "$CANDIDATE_RUN" ]]; then
            [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
            [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            gh run download "$CANDIDATE_RUN" --name package-ubuntu-26.04-x64 --dir "$RUNNER_TEMP/candidate"
            packages=("$RUNNER_TEMP"/candidate/MarkWriter-*-ubuntu-26.04-x64.deb)
            test "${#packages[@]}" -eq 1
            tools/test-ubuntu-wayland.sh "${packages[0]}" "$CANDIDATE_SHA256"
          else
            package="$RUNNER_TEMP/MarkWriter-2.19.3-ubuntu-26.04-x64.deb"
            curl --fail --location --retry 3 --output "$package" "https://github.com/rheiger/markWriter/releases/download/v2.19.3/${package##*/}"
            tools/test-ubuntu-wayland.sh "$package" 88a33f6ad1469ae4c496952eb91ff2c49ba8c84ccf54d2d90276716f14533db1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('package-acceptance-results/ubuntu-wayland/**') != ''
        with:
          name: ubuntu-wayland-evidence
          path: package-acceptance-results/ubuntu-wayland/
