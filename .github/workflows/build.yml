name: Historical Python builds (manual only)

# Historical Python builds are manual artifacts only; Tauri owns v2 publication.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: CLI smoke test (--version)
        run: |
          python markwrite.py --version

      - name: Generate app icon
        run: |
          python tools/generate_icon.py

      - name: Build app with PyInstaller
        run: |
          pyinstaller -y MarkWrite.spec

      - name: Prepare zip name
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=MarkWrite-$VERSION-macOS.zip" >> "$GITHUB_ENV"

      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MarkWrite "dist/${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}

      # macOS job only builds and uploads artifact; publishing is done in a separate job

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate app icon
        run: |
          python tools/generate_icon.py

      - name: CLI smoke test (--version)
        run: |
          python markwrite.py --version

      - name: Prepare version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=MarkWrite-$VERSION-windows.zip" >> "$GITHUB_ENV"

      - name: Build app with PyInstaller (Windows)
        run: |
          pyinstaller -y MarkWrite-win.spec

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }
          $version = "$env:VERSION"
          if ([string]::IsNullOrEmpty($version)) { $version = "latest" }
          makensis /DVERSION=$version installer\windows\markwrite.nsi
          echo "NSIS_EXE=dist/MarkWrite-$version-Setup.exe" >> $env:GITHUB_ENV

      - name: Zip app
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=MarkWrite-$VERSION-windows.zip" >> "$GITHUB_ENV"
          7z a -tzip "dist/${ZIP_NAME}" dist/MarkWrite/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/${{ env.ZIP_NAME }}
            ${{ env.NSIS_EXE }}

      # Windows job only builds and uploads artifacts; publishing is done in a separate job
