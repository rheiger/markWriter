name: PI 2.22 release installed Windows PlantUML package
on:
  push:
    branches: [codex/pi-222-release-installer-qa]
    paths: [research/pi-2.22-release/request.json]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 36
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - name: Download the exact release package and verify its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/pi-2.22-release/download.py windows-x64 package-acceptance-results
      - name: Set up the existing Windows qualification drivers
        run: |
          ./tools/setup-edge-driver.ps1
          ./tools/setup-windows-acceptance.ps1
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify hashes and install unsigned NSIS package
        run: ./research/pi-2.22-windows/install.ps1
      - name: Qualify native Windows editor, preview and HTML export
        env:
          MARKWRITER_PI222_WINDOWS: '1'
        run: |
          & $env:MARKWRITER_GSUDO --integrity Medium pwsh -NoProfile -Command "node tools/installed-package-acceptance.mjs"
          if ($LASTEXITCODE) { throw "Installed Windows PlantUML qualification failed ($LASTEXITCODE)" }
      - name: Retain synthetic qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi222-release-windows-plantuml-evidence
          path: package-acceptance-results/
          retention-days: 14
          if-no-files-found: warn
