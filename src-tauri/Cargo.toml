[package]
name = "markwriter"
version = "2.0.0-alpha.1"
description = "A modern Markdown editor built with Tauri"
authors = ["Richie Eiger <rheiger@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/rheiger/markWriter"
default-run = "markwriter"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2.0", features = [
    "protocol-asset"
] }

# Essential plugins only
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging (minimal)
tracing = "0.1"

[[bin]]
name = "markwriter"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
panic = "abort"
opt-level = "z"
